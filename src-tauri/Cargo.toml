[package]
name = "kmcero_erp"
version = "0.1.0"
description = "KMCero ERP - prototipo operativo local"
authors = ["KMCero ERP"]
edition = "2021"

[lib]
name = "kmcero_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
